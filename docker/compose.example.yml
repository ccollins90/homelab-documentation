# Illustrative Docker Compose template — review before use.
# This is not the live homelab configuration.
# Check current image versions and security guidance before deploying.

services:
  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: uptime-kuma-example
    restart: unless-stopped
    ports:
      # Example host port only; confirm it is available.
      - "3001:3001"
    volumes:
      - uptime_kuma_data:/app/data
    # Do not publish this management interface to the public internet
    # without an intentional, secured access design.

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus-example
    restart: unless-stopped
    ports:
      # Example host port only; bind to localhost if remote access is not needed.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.example.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"

volumes:
  uptime_kuma_data:
  prometheus_data:
