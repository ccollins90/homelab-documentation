# Example Prometheus scrape config. Target names are illustrative.
global:
  scrape_interval: 30s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  # Add a Node Exporter target only when it is available on your
  # Docker network. Avoid publishing metrics endpoints to untrusted networks.
  # - job_name: node
  #   static_configs:
  #     - targets: ["node-exporter:9100"]
